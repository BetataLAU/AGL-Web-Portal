<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>使用者管理 - AGL Portal</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20width='16'%20height='16'%20fill='%2366f'%20/%3E%3Ctext%20x='50%25'%20y='55%25'%20font-size='10'%20text-anchor='middle'%20fill='white'%20font-family='Arial'%3EG%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/base.css">
  <style>
    body { min-height: 100vh; overflow: auto; }
    .container { max-width: 1000px; margin: 0 auto; padding: 24px 16px; position: relative; z-index: 1; }

    .page-header {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 20px 24px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .page-header h1 { margin: 0; font-size: 1.4rem; color: var(--text-main); }
    .page-header .sub { color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; }

    .btn {
      padding: 10px 18px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 0.9rem;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(15,23,42,0.1); }
    .btn-primary { background: var(--primary-gradient); color: #fff; border: none; font-weight: 700; }

    .users-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .users-table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 640px; }
    th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
    th { color: var(--text-muted); font-weight: 600; white-space: nowrap; }
    tr:hover td { background: rgba(37,99,235,0.04); }

    .role-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .role-admin { background: rgba(37,99,235,0.15); color: #2563eb; }
    .role-staff { background: rgba(14,165,233,0.15); color: #0284c7; }
    .role-customer { background: rgba(100,116,139,0.15); color: #475569; }

    .status-badge { font-size: 0.8rem; }
    .status-active { color: #16a34a; }
    .status-disabled { color: #dc2626; }

    .row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .row-actions .btn { padding: 6px 12px; font-size: 0.8rem; }

    /* ===== 新增 / 編輯 Modal ===== */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(2,6,23,0.6);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      z-index: 100;
      backdrop-filter: blur(4px);
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px;
      box-shadow: 0 30px 60px rgba(2,6,23,0.4);
    }

    .modal h2 { margin: 0 0 20px; font-size: 1.2rem; color: var(--text-main); }
    .modal label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-main); margin-bottom: 6px; }
    .modal .field { margin-bottom: 16px; }
    .modal select,
    .modal input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background: var(--input-bg);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    .modal select:focus, .modal input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--surface-glow);
    }

    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
    .hint { color: var(--text-muted); font-size: 0.78rem; margin-top: 6px; }

    .form-error {
      display: none;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.4);
      color: #dc2626;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.85rem;
      margin-bottom: 16px;
    }

    .form-error.show { display: block; }
    .empty-state { text-align: center; color: var(--text-muted); padding: 40px 20px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-header">
      <div>
        <h1>👥 使用者管理</h1>
        <div class="sub" id="login-info">載入中...</div>
      </div>
      <div>
        <a href="index.html" class="btn">← 回主站</a>
        <button type="button" class="btn btn-primary" id="btn-add-user">＋ 新增使用者</button>
      </div>
    </div>

    <div class="users-card">
      <div class="users-table-wrap">
        <table>
          <thead>
            <tr>
              <th>公司</th>
              <th>Company Code</th>
              <th>User ID</th>
              <th>顯示名稱</th>
              <th>角色</th>
              <th>狀態</th>
              <th>建立時間</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="users-tbody">
            <tr><td colspan="8"><div class="empty-state">載入中...</div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/utils/api.js"></script>
  <script>
    // ===== 使用者管理頁邏輯（admin only）=====
    const ROLE_LABELS = { admin: '管理員', staff: '內部員工', customer: '客戶' };
    let usersData = [];
    let companiesData = [];

    function escapeHtml(str) {
      // 注意：使用 \x26（JS 跳脫 = &）避免在 HTML 檔案中被 XML 解碼
      return String(str == null ? '' : str).replace(/[&<>"']/g, m => ({
        '&': '\x26amp;',
        '<': '\x26lt;',
        '>': '\x26gt;',
        '"': '\x26quot;',
        "'": '\x26#39;'
      }[m]));
    }

    // ===== 登入檢查 =====
    async function checkAuth() {
      try {
        const res = await apiFetch('/api/auth/me');
        const user = res.user;
        if (!user) {
          window.location.href = 'index.html';
          return null;
        }
        document.getElementById('login-info').textContent =
          `已登入：${user.company_name} / ${user.display_name}`;

        if (user.role !== 'admin') {
          alert('此頁面僅限管理員使用');
          window.location.href = 'index.html';
          return null;
        }
        return user;
      } catch (e) {
        // apiFetch 已處理 401 跳轉
        return null;
      }
    }

    // 載入公司清單（供新增使用者時選公司）
    async function loadCompanies() {
      const result = await apiFetch('/api/orders/companies');
      companiesData = result.data || [];
    }

    // ===== 載入使用者清單 =====
    async function loadUsers() {
      const result = await apiFetch('/api/auth/users');
      usersData = result.data || [];
      renderUsers();
    }

    function renderUsers() {
      const tbody = document.getElementById('users-tbody');
      if (usersData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state">目前沒有使用者，點「＋ 新增使用者」建立第一個帳號。</div></td></tr>';
        return;
      }

      tbody.innerHTML = usersData.map(u => `
        <tr>
          <td>${escapeHtml(u.company_name || '-')}</td>
          <td><code>${escapeHtml(u.company_code || '-')}</code></td>
          <td><strong>${escapeHtml(u.user_id)}</strong></td>
          <td>${escapeHtml(u.display_name || '-')}</td>
          <td><span class="role-badge role-${u.role}">${ROLE_LABELS[u.role] || u.role}</span></td>
          <td>
            <span class="status-badge ${u.is_active ? 'status-active' : 'status-disabled'}">
              ${u.is_active ? '● 啟用' : '○ 停用'}
            </span>
          </td>
          <td>${u.created_at ? new Date(u.created_at).toLocaleDateString() : '-'}</td>
          <td class="row-actions">
            <button type="button" class="btn" data-action="edit" data-id="${u.id}">編輯</button>
            <button type="button" class="btn" data-action="reset" data-id="${u.id}">重設密碼</button>
            <button type="button" class="btn" data-action="toggle" data-id="${u.id}">
              ${u.is_active ? '停用' : '啟用'}
            </button>
          </td>
        </tr>
      `).join('');

      // 綁定操作事件
      tbody.querySelectorAll('[data-action]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = Number(btn.dataset.id);
          const user = usersData.find(u => Number(u.id) === id);
          if (!user) return;
          if (btn.dataset.action === 'edit') showEditModal(user);
          else if (btn.dataset.action === 'reset') showResetPasswordModal(user);
          else if (btn.dataset.action === 'toggle') toggleUser(user);
        });
      });
    }

    // ===== 新增使用者 =====
    function showAddModal() {
      const overlay = document.createElement('div');
      overlay.className = 'overlay';
      overlay.innerHTML = `
        <div class="modal">
          <h2>＋ 新增使用者</h2>
          <div class="form-error" id="modal-error"></div>

          <div class="field">
            <label>公司</label>
            <select id="f-company">
              <option value="">-- 請選擇公司 --</option>
              ${companiesData.map(c => `<option value="${c.id}">${escapeHtml(c.name)}${c.company_code ? ` (${escapeHtml(c.company_code)})` : ''}</option>`).join('')}
            </select>
            <div class="hint">若公司不在清單，請先在訂單系統的「公司管理」新增公司並設定 Company Code。</div>
          </div>

          <div class="field">
            <label>User ID（登入帳號）</label>
            <input type="text" id="f-userid" maxlength="20" placeholder="例如：alice" />
            <div class="hint">2-20 位英文、數字或底線；系統會自動轉為小寫。</div>
          </div>

          <div class="field">
            <label>密碼</label>
            <input type="text" id="f-password" maxlength="20" placeholder="例如：ag1234" />
            <div class="hint">4-20 位，須包含英文與數字。</div>
          </div>

          <div class="field">
            <label>顯示名稱</label>
            <input type="text" id="f-display" maxlength="50" placeholder="選填，例如：陳小姐" />
          </div>

          <div class="field">
            <label>角色</label>
            <select id="f-role">
              <option value="customer">客戶（只能看自己公司的訂單）</option>
              <option value="staff">內部員工（可看所有訂單、資料庫）</option>
              <option value="admin">管理員（含使用者管理）</option>
            </select>
          </div>

          <div class="modal-actions">
            <button type="button" class="btn" id="modal-cancel">取消</button>
            <button type="button" class="btn btn-primary" id="modal-save">✅ 建立</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      const errorBox = overlay.querySelector('#modal-error');
      overlay.querySelector('#modal-cancel').addEventListener('click', () => overlay.remove());
      overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });

      overlay.querySelector('#modal-save').addEventListener('click', async () => {
        errorBox.classList.remove('show');
        const payload = {
          company_id: overlay.querySelector('#f-company').value,
          user_id: overlay.querySelector('#f-userid').value.trim(),
          password: overlay.querySelector('#f-password').value,
          display_name: overlay.querySelector('#f-display').value.trim(),
          role: overlay.querySelector('#f-role').value
        };

        if (!payload.company_id) { showModalError(errorBox, '請選擇公司'); return; }
        if (!payload.user_id) { showModalError(errorBox, '請填寫 User ID'); return; }
        if (!payload.password) { showModalError(errorBox, '請填寫密碼'); return; }

        try {
          const result = await apiFetch('/api/auth/users', {
            method: 'POST',
            body: JSON.stringify(payload)
          });
          alert('使用者已建立');
          overlay.remove();
          await loadUsers();
        } catch (err) {
          showModalError(errorBox, err.message);
        }
      });
    }

    // ===== 編輯使用者 =====
    function showEditModal(user) {
      const overlay = document.createElement('div');
      overlay.className = 'overlay';
      overlay.innerHTML = `
        <div class="modal">
          <h2>✏️ 編輯使用者 #${user.id}</h2>
          <div class="form-error" id="modal-error"></div>

          <div class="field">
            <label>公司</label>
            <input type="text" value="${escapeHtml(user.company_name || '')}" disabled />
          </div>

          <div class="field">
            <label>User ID</label>
            <input type="text" value="${escapeHtml(user.user_id)}" disabled />
          </div>

          <div class="field">
            <label>顯示名稱</label>
            <input type="text" id="f-display" maxlength="50" value="${escapeHtml(user.display_name || '')}" />
          </div>

          <div class="field">
            <label>角色</label>
            <select id="f-role">
              <option value="customer" ${user.role === 'customer' ? 'selected' : ''}>客戶</option>
              <option value="staff" ${user.role === 'staff' ? 'selected' : ''}>內部員工</option>
              <option value="admin" ${user.role === 'admin' ? 'selected' : ''}>管理員</option>
            </select>
          </div>

          <div class="modal-actions">
            <button type="button" class="btn" id="modal-cancel">取消</button>
            <button type="button" class="btn btn-primary" id="modal-save">💾 儲存</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      const errorBox = overlay.querySelector('#modal-error');
      overlay.querySelector('#modal-cancel').addEventListener('click', () => overlay.remove());
      overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });

      overlay.querySelector('#modal-save').addEventListener('click', async () => {
        errorBox.classList.remove('show');
        const payload = {
          display_name: overlay.querySelector('#f-display').value.trim(),
          role: overlay.querySelector('#f-role').value
        };
        try {
          const result = await apiFetch(`/api/auth/users/${user.id}`, {
            method: 'PUT',
            body: JSON.stringify(payload)
          });
          alert('已儲存');
          overlay.remove();
          await loadUsers();
        } catch (err) {
          showModalError(errorBox, err.message);
        }
      });
    }

    // ===== 重設密碼 =====
    function showResetPasswordModal(user) {
      const overlay = document.createElement('div');
      overlay.className = 'overlay';
      overlay.innerHTML = `
        <div class="modal">
          <h2>🔑 重設密碼</h2>
          <p style="color:var(--text-muted);font-size:0.9rem;margin:0 0 16px;">
            帳號：<strong>${escapeHtml(user.user_id)}</strong>（${escapeHtml(user.company_name || '')}）
          </p>
          <div class="form-error" id="modal-error"></div>

          <div class="field">
            <label>新密碼</label>
            <input type="text" id="f-password" maxlength="20" placeholder="例如：ag1234" />
            <div class="hint">4-20 位，須包含英文與數字。</div>
          </div>

          <div class="modal-actions">
            <button type="button" class="btn" id="modal-cancel">取消</button>
            <button type="button" class="btn btn-primary" id="modal-save">🔑 重設</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      const errorBox = overlay.querySelector('#modal-error');
      overlay.querySelector('#modal-cancel').addEventListener('click', () => overlay.remove());
      overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });

      overlay.querySelector('#modal-save').addEventListener('click', async () => {
        errorBox.classList.remove('show');
        const password = overlay.querySelector('#f-password').value;
        if (!password) { showModalError(errorBox, '請填寫新密碼'); return; }
        try {
          const result = await apiFetch(`/api/auth/users/${user.id}/reset-password`, {
            method: 'PUT',
            body: JSON.stringify({ password })
          });
          alert('密碼已重設');
          overlay.remove();
        } catch (err) {
          showModalError(errorBox, err.message);
        }
      });
    }

    // ===== 啟用 / 停用 =====
    async function toggleUser(user) {
      const action = user.is_active ? '停用' : '啟用';
      if (!confirm(`確定要${action}帳號「${user.user_id}」（${user.company_name || ''}）嗎？`)) return;
      try {
        const result = await apiFetch(`/api/auth/users/${user.id}`, {
          method: 'PUT',
          body: JSON.stringify({ is_active: !user.is_active })
        });
        alert(`已${action}`);
        await loadUsers();
      } catch (err) {
        alert(`操作失敗：${err.message}`);
      }
    }

    function showModalError(box, msg) {
      box.textContent = msg;
      box.classList.add('show');
    }

    // ===== 入口 =====
    (async function init() {
      const user = await checkAuth();
      if (!user) return; // 已跳轉
      try {
        await loadCompanies();
        await loadUsers();
      } catch (err) {
        alert(`載入失敗：${err.message}`);
      }
      document.getElementById('btn-add-user').addEventListener('click', showAddModal);
    })();
  </script>
</body>
</html>
